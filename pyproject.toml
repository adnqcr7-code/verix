[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verix"
version = "0.1.0"
description = "A privacy-conscious, AI-assisted threat intelligence platform for detecting scams, analyzing suspicious activity and protecting online communities."
requires-python = ">=3.11"
license = {text = "TBD"}
dependencies = [
  "discord.py>=2.3",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
